<!DOCTYPE html>
<html>
<head>
    <style>
        body, html {
          height: 100%;
          width: 100%;
          margin: 0;
          background: transparent;
          overflow: hidden;
        }

        .viewport {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 50%;
        }

        #viewport-left {
          left: 0;
        }

        #viewport-right {
          right: 0;
        }

        #viewport-center {
          left: 50%;
          transform: translateX(-50%);
        }

        .page {
          /* Centers vertically the iframe */
          position: absolute;
          top: 50%;
          transform: translateY(-50%);

          width: 0px;
          height: 0px;
          border: none;
          background: white;
        }

        #page-left {
          right: 0;
        }

        #page-right {
          left: 0;
        }

        #page-center {
          /* Centers vertically and horizontally the iframe */
          left: 50%;
          transform: translate(-50%, -50%);
        }
    </style>

    <meta content="" name="viewport">
</head>

<body>
<div class="viewport" id="viewport-left">
    <iframe class="page" id="page-left" scrolling="no"></iframe>
</div>
<div class="viewport" id="viewport-right">
    <iframe class="page" id="page-right" scrolling="no"></iframe>
</div>
<div class="viewport" id="viewport-center">
    <iframe class="page" id="page-center" scrolling="no"></iframe>
</div>

<script src="{{ASSETS_URL}}/scripts/readium-fixed-wrapper-two.js" type="text/javascript"></script>
</body>
</html>
